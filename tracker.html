<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>VIA Rail &amp; Amtrak live map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3f1ea;--text:#14181c;--muted:#667085;
  --glass:rgba(255,255,255,.95);--line:rgba(0,0,0,.09);--soft:rgba(0,0,0,.045);
  --shadow:0 6px 22px rgba(0,0,0,.18);--r:14px;
  --accent:#2f6fdb;--none:#7c878e;--good:#1f9d5b;--warn:#c26a26;--mid:#a87f10;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#101418;--text:#eef2f6;--muted:#93a1ae;
  --glass:rgba(26,32,39,.95);--line:rgba(255,255,255,.12);--soft:rgba(255,255,255,.06);
  --shadow:0 6px 22px rgba(0,0,0,.55);
  --accent:#6f9cf2;--good:#5fe39a;--warn:#ffab6b;--mid:#f0c95e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;font-family:var(--font);transition:background .3s}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--font);background:var(--bg);-webkit-tap-highlight-color:transparent}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7);color:#333}
[data-theme="dark"] .leaflet-control-attribution{background:rgba(0,0,0,.7);color:#aaa}
[data-theme="dark"] .leaflet-control-attribution a{color:#ccc}

.leaflet-rails-pane{filter:saturate(2) contrast(1.5)}
[data-theme="dark"] .leaflet-rails-pane{filter:saturate(1.6) contrast(1.3) brightness(1.7)}

#hud,#panel,.custom-control{
  background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

#hud{
  position:fixed;z-index:1000;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);
  border-radius:var(--r);padding:8px 12px;font-size:12.5px;line-height:1.3;display:grid;gap:6px;-webkit-tap-highlight-color:transparent;
}
#hud .row{display:flex;align-items:center;gap:6px}
#hud .live{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 2s infinite}
#hud.err .live{background:var(--warn);animation:none}
#hud b{font-weight:800}
#hud .age{color:var(--muted)}
#hud .legend{display:flex;flex-wrap:wrap;gap:4px 10px;max-width:min(300px,calc(100vw - 48px));color:var(--muted);font-size:11.5px;font-weight:600}
#hud .legend span{display:flex;align-items:center;gap:5px}
#hud .legend i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
@keyframes blink{50%{opacity:.35}}

.t{
  position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--c,var(--none));color:#fff;border:2px solid #fff;border-radius:99px;padding:3px 9px;
  font:700 12.5px/1.2 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer;
  transition:transform .15s,opacity .3s,filter .3s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
.t::after{content:"";position:absolute;inset:-8px;border-radius:99px}
@media (hover:hover){.t:hover{transform:translate(-50%,-50%) scale(1.06)}}
.t.stale{opacity:.45;filter:grayscale(1)}
.t.selected{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.5)}
.t .tn{color:#fff;font-size:inherit;letter-spacing:.1px;text-transform:none}
.t .arrow{width:11px;height:11px;fill:#fff;flex:none}

.ghost-marker{
  position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;
  background:rgba(0,0,0,.3);border:2px dashed #fff;border-radius:50%;
  pointer-events:none;opacity:.85;transition:opacity .4s ease;
}
.t.guess{border-style:dashed}
.badge.likely{background:transparent;color:var(--c);border:1px dashed var(--c)}
.spot-pick-marker{
  position:relative;width:26px;height:26px;border-radius:50%;
  border:3px solid #00b894;background:rgba(255,255,255,.9);
  box-shadow:0 0 0 3px rgba(0,184,148,.3),0 2px 8px rgba(0,0,0,.4);
}
.spot-pick-marker::before{content:'';position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:50%;background:#00b894;transform:translate(-50%,-50%)}
.user-location-dot{width:16px;height:16px;background:#007cff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,.5);position:relative;transform:translate(-50%,-50%)}
.user-location-dot::after{content:'';position:absolute;inset:-10px;border-radius:50%;background:rgba(0,124,255,.3);animation:pulse-blue 2s infinite;z-index:-1}
@keyframes pulse-blue{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}

#panel{
  position:fixed;z-index:1100;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;font-size:13px;line-height:1.4;
  animation:pin .18s ease-out;
}
#panel[hidden]{display:none}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.phead{position:relative;display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;flex:none}
.grab{display:none}
.ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.pnum{font-size:16px;font-weight:800;white-space:nowrap}
.pclose{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pclose:hover{color:var(--text)}
.pbody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 14px 12px}
.psub{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px;color:#fff;background:var(--c,var(--none));max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800}
.muted{color:var(--muted);font-size:12px}

.next{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;border-radius:12px;
  background:rgba(47,111,219,.1);border:1px solid rgba(47,111,219,.25)}
.next.none{background:var(--soft);border-color:var(--line)}
.nname{font-size:15px;font-weight:800;word-break:break-word}
.nr{text-align:right;flex:none}
.ntime{font-size:21px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
.nmeta{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px}
.nsub{font-size:11px;color:var(--muted);margin-top:1px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--soft);border-radius:10px;padding:6px 8px;min-width:0}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}
.stat .v{font-size:12.5px;font-weight:700;white-space:nowrap}

.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800}
.pill.ok{background:rgba(45,180,110,.16);color:var(--good)}
.pill.idle{background:rgba(140,140,140,.2);color:var(--muted)}
.pill.warn{background:rgba(230,120,60,.18);color:var(--warn)}
.pill.mid{background:rgba(220,170,40,.18);color:var(--mid)}

.sec{padding-top:8px;border-top:1px solid var(--line)}
.sec .lbl{margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--soft);padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.unk{outline:1px dashed var(--muted);background:transparent}
.note{color:var(--muted);font-size:11px;margin-top:5px}
.foot{margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none;font-weight:800}

.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.erow:first-of-type{border-top:none}
.eid{font-weight:800;color:var(--accent);font-size:14px;margin-right:6px}
.esub{font-size:11.5px;color:var(--muted);margin-top:1px}
.etime{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.ein{font-size:11px;color:var(--muted);text-align:right}

.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin:0 12px 16px 0 !important;border:none !important;box-shadow:var(--shadow) !important;border-radius:12px !important;overflow:hidden}
.leaflet-control-zoom a{background:var(--glass) !important;color:var(--text) !important;border-color:var(--line) !important}
.control-stack{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:calc(env(safe-area-inset-left,0px) + 12px);z-index:1000;display:flex;flex-direction:column;gap:8px}
.custom-control{border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;
  transition:color .2s,border-color .2s,opacity .2s,transform .1s}
.custom-control:active{transform:scale(.94)}
.custom-control svg{width:22px;height:22px;fill:currentColor}
.custom-control.off{opacity:.5}
.custom-control.active{color:var(--accent);border-color:var(--accent)}

#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,10px);
  background:rgba(20,24,30,.94);color:#fff;padding:9px 14px;border-radius:12px;font:600 13px/1.3 var(--font);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;z-index:2000;max-width:min(90vw,360px);text-align:center;transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.custom-control:focus-visible,.pclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (pointer:coarse){
  .leaflet-control-zoom{display:none}
  .custom-control{width:46px;height:46px}
}
@media (max-width:640px){
  .t{padding:5px 10px;font-size:13px}
  #hud{cursor:pointer}
  #hud .legend{display:none}
  #hud.open .legend{display:flex}
  #panel{top:auto;left:8px;right:8px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-height:min(60%,480px);border-radius:18px}
  .phead{padding-top:16px}
  .grab{display:block;position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .pclose{width:36px;height:36px}
  .pbody{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  body.panel-open .control-stack,body.panel-open .leaflet-control-zoom,body.panel-open .leaflet-control-attribution{display:none}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="row"><span class="live"></span><b id="hudCount">–</b><span>trains</span><span class="age" id="hudAge">connecting…</span></div>
  <div class="legend" id="legend"></div>
</div>
<aside id="panel" hidden></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  "use strict";

  /* ============================================================
     Config
     ============================================================ */
  const CARTO_KEY   = "cb1_4xye_1_aa4fb015bc8c8a032b8330cc";
  const WORKER_URL  = "";
  const VIA_FEED    = "https://tsimobile.viarail.ca/data/allData.json";
  const AMTRAK_FEED = "https://api-v3.amtraker.com/v3/trains";
  const CONSIST_API = "https://traincar.info/api";

  const REFRESH_MS   = 15000;
  const TIMEOUT_MS   = 9000;
  const TTL_OK       = 30 * 60 * 1000;
  const TTL_NONE     =  5 * 60 * 1000;
  const TTL_ERR      =       45000;
  const STALE_MS     = 120000;
  const GHOST_MAX_MS = 15 * 60 * 1000;
  const GHOST_MAX_KM = 20;

  const SPOT_RADIUS_KM    = 100;
  const SPOT_ANGLE_MAX    = 55;
  const SPOT_TRACK_FACTOR = 1.15;
  const SPOT_MIN_SPEED    = 15;

  const CANADA_BOUNDS = { minLat: 40, maxLat: 85, minLng: -145, maxLng: -50 };

  const NET_COLORS = { via: "#d0342c", amtrak: "#1d5fb4" };
  const NET_NAMES  = { via: "VIA Rail", amtrak: "Amtrak" };

  const RELAYS = [
    u => u,
    u => "https://proxy.cors.dev/" + u,
    u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u)
  ];
  const FEED_ROUTES = WORKER_URL ? [() => WORKER_URL, ...RELAYS] : RELAYS;

  /* ============================================================
     Fetch — with per-payload validation so bad relays are skipped
     ============================================================ */
  async function getJson(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      let data = JSON.parse(await res.text());
      if (data && typeof data.contents === "string") data = JSON.parse(data.contents);
      if (!data || typeof data !== "object") throw new Error("Bad payload");
      return data;
    } finally {
      clearTimeout(timer);
    }
  }
  function makeFetcher(routes, race, validate) {
    let good = 0;
    const tryRoute = async (i, url) => {
      const d = await getJson(routes[i](url));
      if (validate && !validate(d)) throw new Error("Invalid payload from route " + i);
      return d;
    };
    return async function (url) {
      if (race) {
        try { return await tryRoute(good, url); } catch (err) { /* fall through */ }
        const rest = [...routes.keys()].filter(i => i !== good);
        try {
          const w = await Promise.any(rest.map(i => tryRoute(i, url).then(d => ({ i, d }))));
          good = w.i;
          return w.d;
        } catch { throw new Error("All routes failed"); }
      }
      const order = [...new Set([good, ...routes.keys()])];
      let lastErr = null;
      for (const i of order) {
        try {
          const data = await tryRoute(i, url);
          good = i;
          return data;
        } catch (err) { lastErr = err; }
      }
      throw lastErr || new Error("All routes failed");
    };
  }
  const fetchVia     = makeFetcher(FEED_ROUTES, true,  looksLikeViaFeed);
  const fetchAmtrak  = makeFetcher(FEED_ROUTES, false, looksLikeAmtrakFeed);
  const fetchConsist = makeFetcher(RELAYS, false);

  /* ============================================================
     Helpers
     ============================================================ */
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const DATE_RE = /\d{4}-\d{2}-\d{2}/;

  const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ESC_MAP[ch]);

  function finiteNumber(v) {
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    if (typeof v !== "string") return null;
    const n = Number(v.trim());
    return Number.isFinite(n) ? n : null;
  }
  function pickNumber(o, keys) {
    for (const k of keys) { const v = finiteNumber(o[k]); if (v !== null) return v; }
    return null;
  }
  function pickValue(o, keys) {
    for (const k of keys) {
      const v = o[k];
      if (v !== undefined && v !== null && v !== "") return v;
    }
    return null;
  }
  function pickString(o, keys) {
    const v = pickValue(o, keys);
    if (v === null) return null;
    const s = String(v).trim();
    return s || null;
  }

  const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  function compass(deg) {
    const d = ((Number(deg) || 0) % 360 + 360) % 360;
    return DIRS[Math.round(d / 22.5) % 16];
  }
  const CARDINAL = {
    N: 0, NNE: 22.5, NE: 45, ENE: 67.5, E: 90, ESE: 112.5, SE: 135, SSE: 157.5,
    S: 180, SSW: 202.5, SW: 225, WSW: 247.5, W: 270, WNW: 292.5, NW: 315, NNW: 337.5
  };
  function fmtAge(sec) {
    if (sec < 5) return "just now";
    if (sec < 60) return sec + "s ago";
    const min = Math.floor(sec / 60);
    if (min < 60) return min + " min ago";
    return Math.floor(min / 60) + " h ago";
  }
  function fmtClock(ms) {
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtIn(ms) {
    const min = Math.round(ms / 60000);
    if (min < 1) return "now";
    if (min < 60) return `in ${min} min`;
    const h = Math.floor(min / 60), r = min % 60;
    return r ? `in ${h} h ${r} min` : `in ${h} h`;
  }
  function parseTime(v) {
    if (v == null) return null;
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    const s = String(v).trim();
    if (!s) return null;
    let ms = Date.parse(s.replace(" ", "T"));
    if (Number.isFinite(ms)) return ms;
    ms = Date.parse(s);
    return Number.isFinite(ms) ? ms : null;
  }
  function fmtFeedTime(v) {
    if (v == null) return null;
    if (typeof v === "string") {
      const m = v.match(/[T\s](\d{2}):(\d{2})/);
      if (m) return `${m[1]}:${m[2]}`;
    }
    const ms = parseTime(v);
    return ms !== null ? fmtClock(ms) : null;
  }

  function getDistanceAndBearing(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const dist = R * c;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    const brng = Math.atan2(y, x) * 180 / Math.PI;
    return { dist, bearing: (brng + 360) % 360 };
  }
  function projectForward(lat, lng, bearing, distanceKm) {
    const R = 6371;
    const d = distanceKm / R;
    const brng = bearing * Math.PI / 180;
    const lat1 = lat * Math.PI / 180;
    const lng1 = lng * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) +
                           Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
    const lng2 = lng1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
                                   Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
    return { lat: lat2 * 180 / Math.PI, lng: lng2 * 180 / Math.PI };
  }
  function angleDiff(a, b) {
    const d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }

  /* ============================================================
     Feed shape validators
     ============================================================ */
  function looksLikeViaFeed(data) {
    if (!data || typeof data !== "object") return false;
    if (Array.isArray(data)) return data.length > 0;
    const src = data.trains || data.data || data;
    if (Array.isArray(src)) return src.length > 0;
    if (!src || typeof src !== "object") return false;
    return Object.keys(src).some(k => /^\d{1,4}(-\d{4}-\d{2}-\d{2})?$/.test(k));
  }
  function looksLikeAmtrakFeed(data) {
    if (!data) return false;
    if (Array.isArray(data)) return true;
    if (typeof data !== "object") return false;
    if (Array.isArray(data.amtrak)) return true;
    for (const k in data) if (Array.isArray(data[k])) return true;
    return false;
  }

  /* ============================================================
     Consist classification (VIA only)
     ============================================================ */
  const MODELS = {
    siemens:     { name: "Venture",     color: "#2f6fdb" },
    lrc:         { name: "LRC",         color: "#d9822b" },
    hep:         { name: "HEP",         color: "#8a5cd6" },
    renaissance: { name: "Renaissance", color: "#1fa38a" },
    budd:        { name: "Budd",        color: "#c0392b" },
    rdc:         { name: "RDC",         color: "#8d6e4a" }
  };
  const LOCO_MODELS = {
    f40:  { name: "F40PH-2D", color: "#c0392b" },
    p42:  { name: "P42DC",    color: "#2f6fdb" },
    scv:  { name: "SCV-42 Charger", color: "#1fa38a" },
    other:{ name: "Other",    color: "#7c878e" }
  };
  function locoModelOf(num) {
    const n = parseInt(String(num).replace(/\D/g, ""), 10);
    if (!Number.isFinite(n)) return null;
    if (n >= 6400 && n <= 6459) return "f40";
    if (n >= 900  && n <= 920)  return "p42";
    if (n >= 2200 && n <= 2231) return "scv";
    return null;
  }
  function inferLocoFromMix(mix) {
    if (!mix || !mix.length) return null;
    const primary = mix[0].model;
    if (primary === "siemens") return "scv";
    if (primary === "renaissance") return "p42";
    // HEP / Budd stainless and LRC cars commonly use F40s.
    // RDC is self-propelled (no separate locomotive) — do not infer.
    if (primary === "hep" || primary === "budd" || primary === "lrc") return "f40";
    return null;
  }
  const MODEL_RULES = [
    ["siemens",     /VENTURE|(^|[^A-Z])VEN/],
    ["lrc",         /(^|[^A-Z])LRC/],
    ["hep",         /(^|[^A-Z])HEP/],
    ["renaissance", /RENAISSANCE|(^|[^A-Z])REN([^A-Z]|$)/],
    ["budd",        /SKYLINE|CH[AÂ]TEAU|MANOR|PRESTIGE|CABIN|(^|[^A-Z])PARK([^A-Z]|$)|BUDD|SLEEPER|DOME|BAGGAGE|STAINLESS/],
    ["rdc",         /(^|[^A-Z])RDC|RAIL DIESEL/]
  ];
  const LOCO_RE = /(^|[^A-Z])(SC-?44|ALC-?42|CHARGER|P42|F40|FP-?9|LOCO)/;

  function classify(cars) {
    const counts = {}, unknown = [], locos = [];
    let n = 0;
    for (const car of cars) {
      const up = String(car.text).toUpperCase();
      const fromNumber = locoModelOf(car.raw);
      const textLooksLoco = LOCO_RE.test(up);
      if (fromNumber || textLooksLoco) {
        let model = fromNumber;
        if (!model) {
          if (/SC-?44|CHARGER|ALC-?42/.test(up)) model = "scv";
          else if (/P42/.test(up)) model = "p42";
          else if (/F40|FP-?9|LOCO/.test(up)) model = "f40";
          else model = "other";
        }
        locos.push({ raw: car.raw, model });
        continue;
      }
      n++;
      const rule = MODEL_RULES.find(([, re]) => re.test(up));
      if (rule) counts[rule[0]] = (counts[rule[0]] || 0) + 1;
      else unknown.push(car.raw);
    }
    const mix = Object.entries(counts)
      .map(([model, count]) => ({ model, count }))
      .sort((a, b) => b.count - a.count);
    return { model: mix.length ? mix[0].model : null, mix, unknown, locos, cars: n };
  }
  const LONG_DISTANCE = { 1:"budd", 2:"budd", 5:"budd", 6:"budd", 14:"budd", 15:"budd", 690:"budd", 691:"budd", 185:"rdc", 186:"rdc" };
  function guessOf(t) {
    if (!t || t.net !== "via") return null;
    const n = parseInt(t.label, 10);
    if (!Number.isFinite(n)) return null;
    if (LONG_DISTANCE[n]) return LONG_DISTANCE[n];
    return (n >= 20 && n <= 99) || (n >= 600 && n <= 689) ? "siemens" : null;
  }
  const tally = arr => { const m = new Map(); for (const x of arr) m.set(x, (m.get(x) || 0) + 1); return m; };

  /* ============================================================
     State
     ============================================================ */
  const consists = {};
  const queue = [];
  const markers    = new Map();
  const estMarkers = new Map();
  const estLines   = new Map();
  let active = 0;
  let firstFit = true;
  let lastOk = 0;
  let feedErr = false;
  let viaCache = [];
  let amtrakCache = [];

  const dateOf = t => t._date || (String(t.instance).match(DATE_RE) || [ymd(new Date())])[0];
  const prevDay = s => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m-1, d-1)); };
  const keyOf   = t => t._key  || (t.label + "|" + dateOf(t));
  const modelOf = t => (consists[keyOf(t)] || {}).model || null;

  const CAR_KEYS = ["carriages", "cars", "consist", "equipment", "units"];
  function findCars(d, depth = 0) {
    if (!d || typeof d !== "object" || depth > 3) return null;
    if (d.carriageLayout && Array.isArray(d.carriageLayout.carriages)) return d.carriageLayout.carriages;
    for (const k of CAR_KEYS) if (Array.isArray(d[k])) return d[k];
    for (const k of ["data", "result", "train", "trip"]) {
      const r = findCars(d[k], depth + 1);
      if (r) return r;
    }
    return null;
  }
  function carList(data) {
    const cars = findCars(data);
    if (!cars) return null;
    const out = [];
    for (const c of cars) {
      if (typeof c === "string") { if (c.trim()) out.push({ raw: c.trim(), text: c }); continue; }
      if (!c || typeof c !== "object") continue;
      const parts = [c.carriage_code, c.code, c.carriage_type, c.type, c.name, c.model, c.class, c.series]
        .filter(v => v != null && v !== "").map(String);
      if (parts.length) out.push({ raw: parts[0], text: parts.join(" ") });
    }
    return out.length ? out : null;
  }
  let rawLogged = 0;
  async function lookup(t, date, retryPrev) {
    const data = await fetchConsist(`${CONSIST_API}?date=${encodeURIComponent(date)}&number=${encodeURIComponent(t.label)}`);
    if (rawLogged < 3) { rawLogged++; console.info("[consist raw]", t.label, date, data); }
    const num = data && (data.number ?? data.train ?? data.trainNumber ?? data.train_number);
    if (num != null && typeof num !== "object" &&
        String(num).replace(/\D/g, "") !== String(t.label).replace(/\D/g, "")) return null;
    const cars = carList(data);
    if (cars) return cars;
    if (retryPrev) return lookup(t, prevDay(date), false);
    return null;
  }
  async function run(t) {
    const key = keyOf(t);
    try {
      const cars = await lookup(t, dateOf(t), !DATE_RE.test(String(t.instance)));
      const info = cars ? classify(cars) : null;
      consists[key] = { loading: false, err: false, info, model: info ? info.model : null, types: cars, ts: Date.now() };
    } catch {
      const prev = consists[key] || {};
      consists[key] = { loading: false, err: true, info: prev.info || null, model: prev.model || null, types: prev.types || null, ts: Date.now() };
    }
  }
  function request(t) {
    if (!t || t.net !== "via") return;

    if (c && (c.loading || Date.now() - c.ts < ttl)) return;
    consists[key] = { loading: true, err: false, info: c ? c.info : null, model: c ? c.model : null, types: c ? c.types : null, ts: Date.now() };

      active++;

        active--;
        const m = markers.get(t.id);
        if (m) updateMarkerVisual(m);

      });
    }
  }

  /* ============================================================

  function stationArray(o) {

    if (!s) return null;

    }
    return null;
  }

  const sub = (s, k) => (s[k] && typeof s[k] === "object") ? s[k] : null;
  const firstTime = (...vals) => vals.find(v => parseTime(v) !== null) ?? null;

  function extractNextStation(o) {
    const arr = stationArray(o);
    if (arr && arr.length) {
      const now = Date.now();
      let next = null;
      for (const s of arr) {
        if (!s || typeof s !== "object") continue;
        const a = sub(s, "arrival") || {}, d = sub(s, "departure") || {};
        const arrEst = firstTime(a.estimated, a.est, s.estimated, s.est, s.estimatedTime, s.eta);
        const arrSch = firstTime(a.scheduled, a.sched, s.scheduled, s.sched, s.scheduledTime);
        const depEst = firstTime(d.estimated, d.est);
        const depSch = firstTime(d.scheduled, d.sched);
        const arrive = firstTime(arrEst, arrSch);
        const leave  = firstTime(depEst, depSch);
        const arriveMs = parseTime(arrive);
        const leaveMs  = parseTime(leave);
        const flagged = isTrue(s.departed) || isTrue(s.arrived) && leaveMs === null;
        const passed = flagged || (leaveMs !== null ? leaveMs < now : (arriveMs !== null && arriveMs < now));
        if (passed) continue;
        const nameRaw = s.station || s.name || s.city || s.stop || s.stn || s.station_name || s.stationName || s.code || null;
        const name = nameRaw && typeof nameRaw === "object" ? (nameRaw.name || nameRaw.code || null) : nameRaw;

          scheduled: shownSch,
          estimated: shownEst,

  function normaliseVia(raw) {

      if (o.arrived === true  || o.arrived === "true"  || o.arrived === 1)    continue;

      const rawLat = pickNumber(o, ["lat", "latitude"]);
      const rawLng = pickNumber(o, ["lng", "lon", "long", "longitude"]);

          rawLng >= CANADA_BOUNDS.minLng && rawLng <= CANADA_BOUNDS.maxLng) {

        estimated: estMs,

  const themeBtn = makeControl("Toggle light / dark mode", "");
  const SUN_SVG =
    `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>`;

  map.on("locationerror", () => {
    locationBtn.classList.remove("active");
    toast("Couldn't get your location — check your browser permissions.");
  });

  const fitBtn = makeControl(
    "Fit all trains",
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`
  );
  fitBtn.addEventListener("click", () => {
    const pts = [];
    markers.forEach(m => { const ll = m.getLatLng(); pts.push([ll.lat, ll.lng]); });
    if (!pts.length) { toast("No trains to show yet"); return; }
    map.fitBounds(L.latLngBounds(pts).pad(0.1), { maxZoom: 8 });
  });

  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
  }

  /* ============================================================
     Status card
     ============================================================ */
  const hudEl = document.getElementById("hud");
  const hudCount = document.getElementById("hudCount");
  const hudAge = document.getElementById("hudAge");
  hudEl.addEventListener("click", () => hudEl.classList.toggle("open"));
  document.getElementById("legend").innerHTML =
    `<span><i style="--c:${NET_COLORS.via}"></i>${NET_NAMES.via}</span>` +
    `<span><i style="--c:${NET_COLORS.amtrak}"></i>${NET_NAMES.amtrak}</span>` +
    Object.values(MODELS).map(m => `<span><i style="--c:${m.color}"></i>${m.name}</span>`).join("") +
    `<span>Dashed = likely</span>`;
  function updateHud() {
    hudCount.textContent = markers.size || "–";
    document.title = markers.size ? `VIA & Amtrak · ${markers.size} trains` : "Rail live map";
    hudEl.classList.toggle("err", feedErr);
    if (!lastOk) { hudAge.textContent = feedErr ? "· offline, retrying…" : "· connecting…"; return; }
    const sec = Math.round((Date.now() - lastOk) / 1000);
    hudAge.textContent = "· " + (feedErr ? "offline, last " : "") + fmtAge(sec);
  }

  /* ============================================================
     Info panel
     ============================================================ */
  const panelEl = document.getElementById("panel");
  const X_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  const isMobile = () => window.matchMedia("(max-width:640px)").matches;
  let selectedId = null, panelKind = null, panelSig = "";
  let spotMarker = null;

  function clearSpot() { if (spotMarker) { map.removeLayer(spotMarker); spotMarker = null; } }
  function openPanel(kind) {
    panelKind = kind; panelEl.hidden = false;
    document.body.classList.add("panel-open");
  }
  function closePanel() {
    const old = selectedId ? markers.get(selectedId) : null;
    selectedId = null; panelKind = null; panelSig = "";
    panelEl.hidden = true; panelEl.innerHTML = "";
    document.body.classList.remove("panel-open");
    clearSpot();
    if (old) updateMarkerVisual(old);
  }
  function revealMarker(ll) {
    const size = map.getSize(), p = map.latLngToContainerPoint(ll);
    let dx = 0, dy = 0;
    if (isMobile()) { const lim = size.y - panelEl.offsetHeight - 60; if (p.y > lim) dy = p.y - lim; }
    else { const lim = size.x - panelEl.offsetWidth - 40; if (p.x > lim) dx = p.x - lim; }
    if (dx || dy) map.panBy([dx, dy], { animate: true });
  }

  panelEl.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) { closePanel(); return; }
    const row = e.target.closest("[data-train]");
    if (row) selectTrain(row.dataset.train);
  });
  let touchY = null;
  panelEl.addEventListener("touchstart", e => {
    touchY = e.target.closest(".phead") ? e.touches[0].clientY : null;
  }, { passive: true });
  panelEl.addEventListener("touchend", e => {
    if (touchY !== null && isMobile() && e.changedTouches[0].clientY - touchY > 50) closePanel();
    touchY = null;
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && panelKind) closePanel(); });
  map.on("click", e => {
    if (spotMode) showSpotEstimates(e.latlng.lat, e.latlng.lng);
    else if (panelKind) closePanel();
  });

  function showSpotEstimates(lat, lng) {
    clearSpot();
    const prev = selectedId ? markers.get(selectedId) : null;
    selectedId = null;
    if (prev) updateMarkerVisual(prev);

    spotMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: "", html: `<div class="spot-pick-marker"></div>`, iconSize: [26, 26], iconAnchor: [13, 13] }),
      interactive: false, zIndexOffset: 1000
    }).addTo(map);

    const candidates = [];
    const now = Date.now();

    markers.forEach(m => {
      const t = m._t;
      if (!t || t.lat == null || t.lng == null || t.speed < 4) return;
      const pos = m.getLatLng();
      const toSpot = getDistanceAndBearing(pos.lat, pos.lng, lat, lng);
      if (toSpot.dist > SPOT_RADIUS_KM) return;
      const bearing = (typeof m._smoothedBearing === "number" && Number.isFinite(m._smoothedBearing))
        ? m._smoothedBearing : (t.heading || 0);
      const bDiff = angleDiff(bearing, toSpot.bearing);
      if (bDiff > SPOT_ANGLE_MAX) return;
      const trackDist = toSpot.dist * SPOT_TRACK_FACTOR;
      const rawSpeed    = Math.max(t.speed || 0, 1);
      const smoothSpeed = Math.max(m._smoothedSpeed || rawSpeed, 1);
      const speedUsed   = Math.abs(rawSpeed - smoothSpeed) < 20 ? rawSpeed : smoothSpeed;
      const eta = now + (trackDist / Math.max(speedUsed, SPOT_MIN_SPEED) * 3600 * 1000);
      let confidence = "medium";
      if ((now - m._lastSeen) >= 45000 || (now - m._fix.time) >= 150000) confidence = "low";
      else if (toSpot.dist <= 20 && bDiff <= 20 && speedUsed >= 40) confidence = "high";
      else if (toSpot.dist >= 60 || bDiff > 35) confidence = "low";
      if (speedUsed < 20) confidence = "low";
      candidates.push({ train: t, dist: toSpot.dist, eta, speed: speedUsed, confidence, next: t.nextStation });
    });

    const confOrder = { high: 0, medium: 1, low: 2 };
    candidates.sort((a, b) => confOrder[a.confidence] - confOrder[b.confidence] || a.eta - b.eta);

    const confCls = { high: "ok", medium: "mid", low: "idle" };
    const confTxt = { high: "High", medium: "Med", low: "Low" };
    const rows = candidates.slice(0, 6).map(c => {
      const t = c.train;
      const inMin = Math.max(1, Math.round((c.eta - now) / 60000));
      let next = "";
      if (c.next && c.next.name) {
        const when = fmtFeedTime(c.next.estimated) || fmtFeedTime(c.next.scheduled);
        next = ` · next ${esc(c.next.name)}${when ? " " + when : ""}`;
      }
      const netTxt = t.net === "amtrak" ? " · Amtrak" : " · VIA";
      return `
        <div class="erow" data-train="${esc(t.id)}">
          <div>
            <div><span class="eid">#${esc(t.label)}</span><span class="pill ${confCls[c.confidence]}">${confTxt[c.confidence]}</span></div>
            <div class="esub">${c.dist < 1 ? "<1" : c.dist.toFixed(0)} km · ${Math.round(c.speed)} km/h${netTxt}${next}</div>
          </div>
          <div><div class="etime">${fmtClock(c.eta)}</div><div class="ein">in ~${inMin} min</div></div>
        </div>`;
    }).join("");

    openPanel("spot");
    panelEl.innerHTML = `
      <div class="phead"><div class="grab"></div>
        <div class="ptitle"><span class="pnum">Arrivals at this spot</span></div>
        <button class="pclose" data-close type="button" aria-label="Close">${X_SVG}</button>
      </div>
      <div class="pbody">
        ${rows
          ? `<div class="note" style="margin:0 0 4px">Estimated from speed, heading and track curvature. Tap a row for details.</div>${rows}`
          : `<div class="muted">No trains are heading toward this spot within ${SPOT_RADIUS_KM} km.</div>`}
      </div>`;
    revealMarker(L.latLng(lat, lng));
  }

  /* ============================================================
     Train rendering
     ============================================================ */
  function icon(t, bearing) {
    const c = t.net === "amtrak" ? NET_COLORS.amtrak : NET_COLORS.via;
    return L.divIcon({
      className: "", iconSize: [0, 0],
      html:
        `<div class="t" style="--c:${c}">` +
          `<span class="tn">${esc(t.label)}</span>` +
          `<svg class="arrow" viewBox="-6 -6 12 12" style="transform:rotate(${Math.round(bearing || 0)}deg)">` +
            `<path d="M 0,-5 L 4,4 L 0,2 L -4,4 Z"/>` +
          `</svg>` +
        `</div>`
    });
  }
  function modelBadge(t) {
    if (t.net === "amtrak") {
      const route = t.meta && t.meta.route ? t.meta.route : "Amtrak";
      return { text: route, color: NET_COLORS.amtrak };
    }
    const c = consists[keyOf(t)];
    const g = guessOf(t);
    const likely = g ? { text: "Likely " + MODELS[g].name, color: MODELS[g].color, likely: true } : null;
    if (!c || (c.loading && !c.info)) return likely || { text: "Checking…", color: NET_COLORS.via };
    const info = c.info;
    if (!info || !info.mix.length) return likely || { text: "Unconfirmed", color: NET_COLORS.via };
    let text = info.mix.slice(0, 2).map(x => MODELS[x.model].name).join(" + ");
    if (info.mix.length > 2) text += " +";
    if (info.unknown.length) text += " · partial";
    return { text, color: MODELS[info.mix[0].model].color };
  }

  function consistSection(t) {
    const c = consists[t._key];
    if (!c || (c.loading && !c.info)) return `<span class="muted">Loading consist…</span>`;
    if (!c.info) {
      return `<span class="muted">${c.err ? "Consist lookup failed — retrying" : "No consist published for this trip"}</span>`;
    }
    const info = c.info;
    const chips = [];
    for (const { model, count } of info.mix) {
      chips.push(`<span class="chip">${count} × ${esc(MODELS[model].name)}</span>`);
    }
    for (const [raw, n] of tally(info.unknown)) {
      chips.push(`<span class="chip unk">${n} × ${esc(raw)}</span>`);
    }
    const locoChips = [];
    if (info.locos && info.locos.length) {
      const locoGroups = new Map();
      for (const l of info.locos) {
        const g = locoGroups.get(l.model) || { model: l.model, nums: [] };
        g.nums.push(l.raw);
        locoGroups.set(l.model, g);
      }
      for (const { model, nums } of locoGroups.values()) {
        const label = LOCO_MODELS[model].name;
        const numText = nums.slice(0, 3).join(", ") + (nums.length > 3 ? "…" : "");
        locoChips.push(
          `<span class="chip" style="border-left:3px solid ${LOCO_MODELS[model].color}">` +
            `${esc(label)} · #${esc(numText)}${nums.length > 1 ? ` ×${nums.length}` : ""}` +
          `</span>`
        );
      }
    } else {
      const inferred = inferLocoFromMix(info.mix);
      if (inferred) {
        const label = LOCO_MODELS[inferred].name;
        locoChips.push(
          `<span class="chip" style="border-left:3px solid ${LOCO_MODELS[inferred].color}">` +
            `${esc(label)} (inferred)` +
          `</span>`
        );
      }
    }
    let note = "from published consist";
    if (info.unknown.length) note = `${info.unknown.length} car${info.unknown.length === 1 ? "" : "s"} not recognised`;
    else if (info.mix.length > 1) note = "mixed car consist";
    return `
      ${locoChips.length ? `<div class="lbl">Locomotives</div><div class="chips" style="margin-bottom:6px">${locoChips.join("")}</div>` : ""}
      <div class="lbl">Cars</div>
      <div class="chips">${chips.join("")}</div>
      <div class="note">${info.cars} car${info.cars === 1 ? "" : "s"} · ${note}</div>
    `;
  }

  function nextStopBlock(t) {
    const ns = t.nextStation;
    if (!ns || !ns.name) {
      return `<div class="next none"><span class="lbl">Next stop</span><span class="muted">Not in feed</span></div>`;
    }
    const sched = fmtFeedTime(ns.scheduled), est = fmtFeedTime(ns.estimated), delay = ns.delayMin;
    const main = est != null ? est : (sched != null ? sched : "–");
    let chip = "";
    if (delay != null) {
      chip = delay > 0 ? `<span class="pill warn">+${delay} min</span>`
           : delay < 0 ? `<span class="pill ok">${delay} min</span>`
           : `<span class="pill ok">On time</span>`;
    }
    const inTxt = (ns.ms != null && !ns.atStop) ? `<span>${fmtIn(ns.ms - Date.now())}</span>` : "";
    const showSched = (sched != null && est != null && sched !== est) ? `<div class="nsub">sched ${sched}</div>` : "";
    return `
      <div class="next">
        <div><div class="lbl">${ns.atStop ? "At station" : "Next stop"}</div><div class="nname">${esc(ns.name)}</div></div>
        <div class="nr"><div class="ntime">${main}</div><div class="nmeta">${chip}${inTxt}</div>${showSched}</div>
      </div>`;
  }

  const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;

  function trainPanelHtml(t, m) {
    const now = Date.now();
    const ll = m.getLatLng();
    const badge = modelBadge(t);
    const bearing = typeof m._smoothedBearing === "number" ? m._smoothedBearing : (t.heading || 0);
    const ageSec = Math.max(0, Math.round((now - m._lastSeen) / 1000));
    const idleMin = Math.round((now - m._lastMove) / 60000);

    let cls = "ok", status = "Moving";
    if (ageSec * 1000 > STALE_MS) { cls = "warn"; status = "No signal"; }
    else if (t.speed < 5) { cls = "idle"; status = idleMin >= 1 ? `Stopped ${idleMin} min` : "Stopped"; }

    const isVia = t.net === "via";
    let locoHeader = "";
    if (isVia) {
      const c = consists[t._key];
      if (c && c.info) {
        if (c.info.locos && c.info.locos.length) {
          const firstLoco = c.info.locos[0];
          locoHeader = `<div class="muted" style="margin:-2px 0 6px">
             Locomotive: <b>${esc(LOCO_MODELS[firstLoco.model].name)}</b>
             · #${esc(firstLoco.raw)}
             ${c.info.locos.length > 1 ? ` +${c.info.locos.length - 1}` : ""}
           </div>`;
        } else {
          const inferred = inferLocoFromMix(c.info.mix);
          if (inferred) {
            locoHeader = `<div class="muted" style="margin:-2px 0 6px">
             Locomotive: <b>${esc(LOCO_MODELS[inferred].name)}</b> (inferred)
           </div>`;
          }
        }
      }
    }

    const route = (t.meta.from || t.meta.to)
      ? `<span>${esc(t.meta.from || "?")} → ${esc(t.meta.to || "?")}</span>`
      : "";

    const footLabel = t.meta.status
      ? esc(t.meta.status)
      : (isVia ? "VIA Rail live feed" : "Amtrak live feed");

    return `
      <div class="phead"><div class="grab"></div>
        <div class="ptitle"><span class="pnum">Train ${esc(t.label)}</span><span class="badge${badge.likely ? " likely" : ""}" style="--c:${badge.color}">${esc(badge.text)}</span></div>
        <button class="pclose" data-close type="button" aria-label="Close">${X_SVG}</button>
      </div>
      <div class="pbody">
        <div class="psub">${route}<span class="pill ${cls}">${status}</span></div>
        ${locoHeader}
        ${nextStopBlock(t)}
        <div class="stats">
          ${stat("Speed", `${Math.round(t.speed)} km/h`)}
          ${stat("Heading", `${compass(bearing)} ${Math.round(bearing)}°`)}
          ${stat("Last fix", fmtAge(Math.max(0, Math.round((now - m._fix.time) / 1000))))}
        </div>
        ${isVia ? `<div class="sec"><div class="lbl">Consist</div>${consistSection(t)}</div>` : ""}
        <div class="foot">
          <span>${footLabel}</span>
          <a href="https://www.google.com/maps?q=${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}" target="_blank" rel="noopener">Maps ↗</a>
        </div>
      </div>`;
  }

  function popupSignature(t, m) {
    const now = Date.now();
    const ns = t.nextStation;
    const c = t.net === "via" ? consists[t._key] : null;
    const ageSec = Math.max(0, Math.round((now - m._lastSeen) / 1000));
    const locoSig = c && c.info ? (c.info.locos.map(l => l.model).join("+") || inferLocoFromMix(c.info.mix)) : "";
    return [
      t.net, t.label, modelBadge(t).text, Math.round(t.speed),
      ageSec * 1000 > STALE_MS ? "S" : t.speed < 5 ? "I" : "M",
      Math.floor((now - m._fix.time) / 5000), Math.round((now - m._lastMove) / 60000),
      Math.round(m._smoothedBearing || 0),
      ns ? [ns.name, ns.estimated, ns.scheduled, ns.delayMin, ns.atStop,
            ns.ms != null ? Math.round((ns.ms - now) / 60000) : ""].join(",") : "",
      !c ? "?" : c.loading ? "L" : c.err ? "E" : (c.types ? c.types.length : "N"),
      locoSig
    ].join("|");
  }

  function renderPanel(force) {
    if (panelKind !== "train") return;
    const m = markers.get(selectedId);
    if (!m) { closePanel(); return; }
    const sig = popupSignature(m._t, m);
    if (!force && sig === panelSig) return;
    panelSig = sig;
    const body = panelEl.querySelector(".pbody");
    const st = body ? body.scrollTop : 0;
    panelEl.innerHTML = trainPanelHtml(m._t, m);
    const nb = panelEl.querySelector(".pbody");
    if (nb) nb.scrollTop = st;
  }

  function selectTrain(id) {
    const prev = selectedId ? markers.get(selectedId) : null;
    const m = markers.get(id);
    if (!m) return;
    clearSpot();
    selectedId = id; openPanel("train"); panelSig = ""; renderPanel(true);
    if (prev && prev !== m) updateMarkerVisual(prev);
    updateMarkerVisual(m);
    revealMarker(m.getLatLng());
  }

  function fixTimeOf(t, now) { return now; }
  function applyPosition(m) { m.setLatLng([m._fix.lat, m._fix.lng]); }

  function updateMarkerVisual(m) {
    const t = m._t;
    if (!t) return;

    if (!m._bubbleEl) {
      const el = m.getElement();
      if (!el) return;
      const bubble = el.querySelector(".t");
      if (!bubble) return;
      m._bubbleEl  = bubble;
      m._labelEl   = bubble.querySelector(".tn");
      m._arrowEl   = bubble.querySelector(".arrow");
    }

    let color, isGuess = false;
    if (t.net === "amtrak") {
      color = NET_COLORS.amtrak;
    } else {
      const confirmed = modelOf(t);
      const modelKey = confirmed || guessOf(t);
      const model = MODELS[modelKey];
      color = model ? model.color : NET_COLORS.via;
      isGuess = !confirmed && !!model;
    }

    if (m._lastGuess !== isGuess) { m._bubbleEl.classList.toggle("guess", isGuess); m._lastGuess = isGuess; }
    if (m._lastColor !== color) {
      m._bubbleEl.style.setProperty("--c", color);
      m._lastColor = color;
    }

    if (m._labelEl && m._labelEl.textContent !== t.label) {
      m._labelEl.textContent = t.label;
    }

    const bearing = Math.round(m._smoothedBearing || 0);
    if (m._lastBearing !== bearing) {
      if (m._arrowEl) m._arrowEl.style.transform = `rotate(${bearing}deg)`;
      m._lastBearing = bearing;
    }

    const stale = (Date.now() - m._lastSeen) > STALE_MS;
    if (m._lastStale !== stale) {
      m._bubbleEl.classList.toggle("stale", stale);
      m._lastStale = stale;
    }

    const selected = selectedId === t.id;
    if (m._lastSelected !== selected) {
      m._bubbleEl.classList.toggle("selected", selected);
      m.setZIndexOffset(selected ? 1000 : 0);
      m._lastSelected = selected;
    }
  }

  function removeGhost(id, immediate) {
    const line = estLines.get(id);
    if (line) { map.removeLayer(line); estLines.delete(id); }
    const em = estMarkers.get(id);
    if (!em) return;
    estMarkers.delete(id);
    if (immediate) { map.removeLayer(em); return; }
    const el = em.getElement();
    if (el) el.style.opacity = "0";
    setTimeout(() => { if (map.hasLayer(em)) map.removeLayer(em); }, 400);
  }

  function render(trains) {
    if (trains.length === 0 && markers.size > 0) {
      console.warn("No trains in any feed; keeping existing markers.");
      return;
    }

    const keep = new Set();
    const now = Date.now();

    for (const t of trains) {
      if (t.lat === null || t.lng === null) continue;
      keep.add(t.id);

      const seenAt = t._fetchedAt || now;
      let m = markers.get(t.id);

      if (!m) {
        m = L.marker([t.lat, t.lng], { icon: icon(t, t.heading || 0) });
        m._t = t;
        m._lastSeen = seenAt;
        m._lastMove = seenAt;
        m._lastLat = t.lat;
        m._lastLng = t.lng;
        m._history = [{ lat: t.lat, lng: t.lng, speed: t.speed, time: seenAt }];
        m._fix = { lat: t.lat, lng: t.lng, time: seenAt };
        m._corr = null;
        m._smoothedBearing = t.heading || 0;
        m._smoothedSpeed = t.speed || 0;
        m._distance = 0;
        m._popupSig = null;

        const tid = t.id;
        m.on("click", () => selectTrain(tid));

        m.addTo(map);
        markers.set(t.id, m);
        applyPosition(m, now);
        request(t);
      } else {
        m._t = t;
        m._lastSeen = seenAt;

        if (t.lat !== m._lastLat || t.lng !== m._lastLng) {
          const step = getDistanceAndBearing(m._lastLat, m._lastLng, t.lat, t.lng);
          if (step.dist < 50) m._distance += step.dist;
          m._lastMove = seenAt;
          m._lastLat = t.lat;
          m._lastLng = t.lng;
          m._history.push({ lat: t.lat, lng: t.lng, speed: t.speed, time: seenAt });
          if (m._history.length > 6) m._history.shift();
          const speeds = m._history.map(h => h.speed).filter(s => Number.isFinite(s) && s >= 0);
          m._smoothedSpeed = speeds.length ? speeds.reduce((a, b) => a + b, 0) / speeds.length : t.speed;
          const first = m._history[Math.max(0, m._history.length - 3)];
          const last  = m._history[m._history.length - 1];
          const brng  = getDistanceAndBearing(first.lat, first.lng, last.lat, last.lng);
          if (brng.dist > 0.1) m._smoothedBearing = brng.bearing;
          else if (t.heading > 0) m._smoothedBearing = t.heading;
          m._fix = { lat: t.lat, lng: t.lng, time: seenAt };
          m.setLatLng([t.lat, t.lng]);
        }
        request(t);
      }

      updateMarkerVisual(m);
    }

    markers.forEach((m, id) => {
      if (keep.has(id)) return;
      map.removeLayer(m);
      markers.delete(id);
      removeGhost(id, true);
    });
    if (selectedId && !markers.has(selectedId)) closePanel();

    if (firstFit && markers.size) {
      const pts = [];
      markers.forEach(m => { const ll = m.getLatLng(); pts.push([ll.lat, ll.lng]); });
      if (pts.length) {
        map.fitBounds(L.latLngBounds(pts).pad(0.1), { maxZoom: 8 });
        firstFit = false;
      }
    }
  }

  setInterval(() => {
    if (document.hidden) return;
    const now = Date.now();
    updateHud();
    const view = map.getBounds().pad(0.25);
    markers.forEach((m, id) => {
      const t = m._t;
      if (!t) return;
      const age  = now - m._lastSeen;
      const idle = now - m._lastMove;

      if (t.speed < 5 || idle > GHOST_MAX_MS || age > STALE_MS || !view.contains([t.lat, t.lng])) {
        removeGhost(id);
      } else {
        const speed  = m._smoothedSpeed || t.speed || 0;
        const distKm = Math.min(speed * idle / 3600000, GHOST_MAX_KM);
        const est    = projectForward(t.lat, t.lng, m._smoothedBearing || t.heading || 0, distKm);
        let em = estMarkers.get(id);
        if (!em) {
          em = L.marker([est.lat, est.lng], {
            icon: L.divIcon({ className: "", iconSize: [0, 0], html: `<div class="ghost-marker"></div>` }),
            pane: "ghosts", interactive: false, keyboard: false
          }).addTo(map);
          estMarkers.set(id, em);
        } else {
          em.setLatLng([est.lat, est.lng]);
        }
        const pts = [[t.lat, t.lng], [est.lat, est.lng]];
        let line = estLines.get(id);
        if (!line) {
          line = L.polyline(pts, { color: "#8a8f95", weight: 2, dashArray: "5, 6", opacity: 0.55, interactive: false }).addTo(map);
          estLines.set(id, line);
        } else {
          line.setLatLngs(pts);
        }
      }
      updateMarkerVisual(m);
    });
    if (selectedId) renderPanel();
  }, 500);

  /* ============================================================
     Refresh (VIA + Amtrak)
     ============================================================ */
  let busy = false;
  let amtrakLogged = false;
  async function refresh() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      const stamp = Date.now();
      const [viaRes, amRes] = await Promise.allSettled([
        fetchVia(VIA_FEED + "?t=" + stamp),
        fetchAmtrak(AMTRAK_FEED)
      ]);

      let anyOk = false;

      // --- VIA ---
      if (viaRes.status === "fulfilled") {
        const trains = normaliseVia(viaRes.value);
        if (trains.length || !viaCache.length) {
          const at = Date.now();
          for (const t of trains) t._fetchedAt = at;
          viaCache = trains;
        } else {
          console.warn("[VIA] feed empty — keeping previous positions");
        }
        anyOk = true;
      } else {
        console.warn("VIA refresh failed:", viaRes.reason);
      }

      // --- Amtrak ---
      if (amRes.status === "fulfilled") {
        const trains = normaliseAmtrak(amRes.value);
        if (!amtrakLogged) {
          amtrakLogged = true;
          console.info("[amtrak] " + trains.length + " trains; payload keys:",
            amRes.value && typeof amRes.value === "object" ? Object.keys(amRes.value).slice(0, 10) : typeof amRes.value,
            trains[0] || null);
        }
        if (trains.length || !amtrakCache.length) {
          const at = Date.now();
          for (const t of trains) t._fetchedAt = at;
          amtrakCache = trains;
        } else {
          console.warn("[Amtrak] feed empty — keeping previous positions");
        }
        anyOk = true;
      } else {
        console.warn("Amtrak refresh failed:", amRes.reason);
      }

      console.info(`[feeds] VIA ${viaCache.length} · Amtrak ${amtrakCache.length}`);
      render(viaCache.concat(amtrakCache));

      if (anyOk) { lastOk = Date.now(); feedErr = false; }
      else feedErr = true;

      for (const k in consists) {
        const c = consists[k];
        if (!c.loading && lastOk - c.ts > 6 * 3600 * 1000) delete consists[k];
      }
    } catch (err) {
      console.warn("Refresh failed:", err);
      feedErr = true;
    } finally {
      busy = false;
      updateHud();
    }
  }

  setInterval(refresh, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  const onSchemeChange = e => {
    try { if (localStorage.getItem("via-theme")) return; } catch {}
    isDark = e.matches;
    applyTheme();
    updateThemeIcon(); setTiles();
  };
  if (typeof darkQuery.addEventListener === "function") darkQuery.addEventListener("change", onSchemeChange);
  else if (typeof darkQuery.addListener === "function") darkQuery.addListener(onSchemeChange);

  refresh();
})();
</script>
